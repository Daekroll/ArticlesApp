services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_articles:/var/lib/postgresql/data


volumes:
  postgres_articles: